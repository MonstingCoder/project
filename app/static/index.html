<!-- go to http://localhost:8080/docs to see the documentation -->
 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Docs — Localhost</title>
  <style>
    :root{
      --bg1: #071A52;
      --bg2: #0B2A66;
      --card: rgba(255,255,255,0.06);
      --accent: #7BD389;
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.03);
      --text: #E8F0FF;
      --muted: #ACC3FF99;
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      line-height:1.35;
    }

    .wrap{
      width:100%;
      max-width:900px;
      display:flex;
      gap:28px;
      align-items:center;
      justify-content:center;
    }

    .card{
      flex:1 1 520px;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(6px) saturate(120%);
    }

    header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:8px;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background: conic-gradient(from 200deg at 50% 50%, #9AE6B4, #7BD389, #5ED0FF);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 -6px 18px rgba(0,0,0,0.08);
      font-weight:700;
      color:#052040;
      font-size:26px;
    }

    h1{
      margin:0;
      font-size:20px;
      letter-spacing: -0.2px;
    }

    p.lead{
      margin:6px 0 18px 0;
      color:var(--muted);
      font-size:14px;
    }

    .hero {
      background: linear-gradient(180deg, var(--glass), var(--glass-2));
      border-radius:10px;
      padding:18px;
      display:flex;
      gap:16px;
      align-items:center;
    }

    .hero .left{
      flex:1;
      min-width:0;
    }

    .doc-link{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .url {
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,0.02);
      padding:8px 10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      color:var(--text);
      font-size:14px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }

    .btn {
      appearance:none;
      border:0;
      padding:10px 14px;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-weight:600;
      font-size:14px;
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
      border:1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
    }

    .btn:active{ transform: translateY(1px) }
    .btn.primary{
      background: linear-gradient(90deg,#6FE7B2, #39C1FF);
      color:#052040;
      box-shadow: 0 6px 18px rgba(57,193,255,0.15);
      border: none;
    }

    .btn.ghost{
      background:transparent;
      color:var(--muted);
    }

    .illustration{
      width:180px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* small note */
    .note{
      margin-top:16px;
      font-size:13px;
      color:var(--muted);
      display:flex;
      gap:10px;
      align-items:flex-start;
    }

    .copy-toast{
      position:fixed;
      right:20px;
      bottom:20px;
      background: rgba(5,32,64,0.9);
      color:var(--text);
      padding:10px 14px;
      border-radius:10px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.65);
      display:none;
      font-size:13px;
    }

    /* responsive */
    @media (max-width:720px){
      .wrap{ flex-direction:column; padding-top:40px }
      .illustration{ width:140px; order:-1; }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <section class="card" aria-labelledby="title">
      <header>
        <div class="logo" aria-hidden="true">🚀</div>
        <div>
          <h1 id="title">Dokumentasi lokal</h1>
          <p class="lead">Akses dokumentasi server lokalmu dengan cepat — cukup klik tombol di bawah.</p>
        </div>
      </header>

      <div class="hero" role="region" aria-label="Link dokumentasi">
        <div class="left">
          <div class="doc-link" title="Link dokumentasi">
            <div class="url" id="docUrl" aria-live="polite">http://127.0.0.1:8000/docs</div>
          </div>

          <div class="actions" role="toolbar" aria-label="Tindakan">
            <a class="btn primary" id="openBtn" href="http://127.0.0.1:8000/docs" target="_blank" rel="noopener noreferrer">
              Buka dokumentasi
            </a>

            <button class="btn" id="openSame">
              Buka di jendela yang sama
            </button>

            <button class="btn ghost" id="copyBtn" aria-label="Salin alamat dokumentasi">
              Salin alamat
            </button>
          </div>

          <p class="note" id="note">
            <strong>Catatan:</strong>
            Bila server belum dijalankan, jalankan aplikasimu kemudian muat ulang halaman ini.
          </p>
        </div>

        <div class="illustration" aria-hidden="true">
          <!-- Simple SVG rocket illustration -->
          <svg width="120" height="120" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="translate(2 2)" stroke="none" fill="none">
              <ellipse cx="30" cy="46" rx="10" ry="4" fill="#FFD580" opacity=".12"/>
              <path d="M38.5 5.5c-6.5 1.5-18 10-22 19-3 7.2 2.6 12.6 9.3 13.5 8 .9 20.5-2 29-16 3.3-5.6-6.9-17-16.3-16.5z" fill="#7BD389"/>
              <path d="M32 18c1.7 0 3 1.3 3 3s-1.3 3-3 3-3-1.3-3-3 1.3-3 3-3z" fill="#052040"/>
              <rect x="28" y="38" width="8" height="10" rx="3" fill="#FF8A66" opacity=".9"/>
              <path d="M46 22c3 1 8 7 7 10-1 4-9 14-14 16" stroke="#FFF" stroke-opacity=".08" stroke-width="1.2" fill="none"/>
            </g>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <div class="copy-toast" id="toast" role="status" aria-live="polite">Tersalin ke clipboard</div>

  <script>
    // Elements
    const copyBtn = document.getElementById('copyBtn');
    const openSame = document.getElementById('openSame');
    const toast = document.getElementById('toast');
    const url = document.getElementById('docUrl').textContent.trim();

    function showToast(text = 'Tersalin ke clipboard') {
      toast.textContent = text;
      toast.style.display = 'block';
      toast.style.opacity = '1';
      clearTimeout(window._dismissToast);
      window._dismissToast = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => { toast.style.display = 'none'; }, 220);
      }, 1800);
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(url);
        showToast('Alamat disalin: ' + url);
      } catch (e) {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Alamat disalin (fallback)'); } catch(_) { showToast('Gagal menyalin — silakan salin manual'); }
        ta.remove();
      }
    });

    openSame.addEventListener('click', () => {
      window.location.href = url;
    });

    // small UX: detect if localhost is unreachable (best-effort)
    (async function pingLocal() {
      try {
        // Try fetch; will fail cross-origin in some cases but OK for same origin
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 1200);
        await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
        clearTimeout(id);
      } catch (e) {
        // if it fails, show unobtrusive hint
        const note = document.getElementById('note');
        note.innerHTML = '<strong>Catatan:</strong> Kalau dokumentasi tidak terbuka, jalankan server lokal pada port 8080 lalu muat ulang halaman ini.';
      }
    })();
  </script>
</body>
</html>
